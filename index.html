<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCM - Orff Construct Mirror (Beat Edition)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #00adb5; margin-bottom: 5px; }
        .control-panel {
            background: #1e1e1e;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #007a80; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        
        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1000px; }
        .mirror-box, .workspace-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
            min-width: 350px;
        }
        video { transform: scaleX(-1); border-radius: 8px; background: #222; width: 100%; max-width: 400px; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin: 20px 0;
            background: #151515;
            padding: 10px;
            border-radius: 8px;
        }
        .grid-block {
            background: #2d2d2d;
            border: 2px solid #3d3d3d;
            height: 60px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            color: #888;
            transition: all 0.1s ease;
        }
        .grid-block.has-chord { color: #00adb5; font-size: 16px; }
        .grid-block.active {
            background: #00adb5;
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px #00adb5;
            transform: scale(1.05);
        }

        #chord-display { font-size: 72px; font-weight: bold; color: #ffde59; margin: 10px 0; }
        #lyrics-display { font-size: 22px; color: #ffffff; background: #252525; padding: 15px; border-radius: 6px; min-height: 30px; }
        #status { color: #ffde59; font-style: italic; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>OCM: Orff Construct Mirror</h1>
    <p id="status">กำลังดึงข้อมูลระบบจาก Cloud...</p>

    <div class="control-panel">
        <label>เลือกเพลงจากระบบคลาวด์:</label>
        <select id="song-select">
            <option value="die_with_a_smile">Die With A Smile - Bruno Mars</option>
        </select>
        <button id="start-btn" disabled>เริ่มฝึกซ้อมดนตรี</button>
    </div>

    <div class="container">
        <div class="mirror-box">
    <h3>👁️ Visual Mirror (กระจกเงาโต้ตอบอัจฉริยะ)</h3>
    <div style="position: relative; width: 100%; max-width: 400px; margin: 0 auto; aspect-ratio: 4/3;">
        <video id="webcam" autoplay playsinline muted style="display: none;"></video>
        
        <canvas id="output-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px; background: #222; transform: scaleX(-1); border: 2px solid #3d3d3d;"></canvas>
    </div>
</div>

        <div class="workspace-box">
            <h3>🎵 แผงควบคุมจังหวะ (Beat Blocks)</h3>
            <div class="grid-container" id="music-grid"></div>
            <div id="chord-display">--</div>
            <p id="lyrics-display">กดปุ่มเริ่มฝึกซ้อมเพื่อรันจังหวะ</p>
        </div>
    </div>

    <script type="module">
        // 🌟 1. นำเข้าโมดูลทั้งหมดที่ต้องใช้ให้ครบ
        import { OCMVisualEngine } from "./src/mirror.js";
        import { OCMAudioEngine } from "./src/audio.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // 🌟 2. ตั้งค่า Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCxvHXLgdb5FeQS1mW2d4ke9kjdz-i1e54",
            authDomain: "ocm-kbs.firebaseapp.com",
            projectId: "ocm-kbs",
            storageBucket: "ocm-kbs.firebasestorage.app",
            messagingSenderId: "632841277737",
            appId: "1:632841277737:web:20735a0544bc3b759d6738"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🌟 3. เชื่อมต่อ UI Elements
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const songSelect = document.getElementById('song-select');
        const musicGrid = document.getElementById('music-grid');
        const chordDisplay = document.getElementById('chord-display');
        const lyricsDisplay = document.getElementById('lyrics-display');

        let songData = null;
        let blockElements = [];

        // 🌟 4. เตรียมเครื่องยนต์สายตา (Visual Engine) จาก mirror.js
        const visual = new OCMVisualEngine("webcam", "output-canvas");

        // 🌟 5. เตรียมเครื่องยนต์เสียง (Audio Engine) จาก audio.js
        const audio = new OCMAudioEngine(
            (currentBeat) => updateVisuals(currentBeat),
            () => stopSession()
        );

        // 🌟 6. ฟังก์ชันจัดการข้อมูลและ UI (ส่วนที่เหลือใน index)
        async function loadSongFromCloud() {
            const songId = songSelect.value;
            statusText.innerText = "กำลังซิงค์ข้อมูลเพลงและจังหวะดนตรี...";
            
            try {
                const docRef = doc(db, "songs", songId);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    songData = docSnap.data();
                    statusText.innerText = `พร้อมฝึกซ้อม! "${songData.title}" (BPM: ${songData.bpm})`;
                    renderMusicGrid(songData);
                    startBtn.disabled = false;
                } else {
                    statusText.innerText = "ไม่พบเพลงนี้ในฐานข้อมูล";
                }
            } catch (e) {
                statusText.innerText = "ข้อผิดพลาด: " + e.message;
            }
        }

        function renderMusicGrid(data) {
            musicGrid.innerHTML = "";
            blockElements = [];
            for (let i = 0; i < data.totalBeats; i++) {
                const block = document.createElement('div');
                block.className = 'grid-block';
                block.innerText = i + 1;
                
                const chordMatch = data.chordsTimeline.find(item => item.beat === i);
                if (chordMatch) {
                    block.classList.add('has-chord');
                    block.innerText = chordMatch.chord;
                }
                
                musicGrid.appendChild(block);
                blockElements.push(block);
            }
        }

        function updateVisuals(currentBeat) {
            blockElements.forEach(el => el.classList.remove('active'));
            if (blockElements[currentBeat]) {
                blockElements[currentBeat].classList.add('active');
                // เปลี่ยน smooth เป็น auto เพื่อไม่ให้หน้าจอกระตุกตามที่แนะนำไปครับ
                blockElements[currentBeat].scrollIntoView({ behavior: 'auto', block: 'nearest' });
            }

            let activeChord = "--";
            for (let i = 0; i < songData.chordsTimeline.length; i++) {
                if (currentBeat >= songData.chordsTimeline[i].beat) {
                    activeChord = songData.chordsTimeline[i].chord;
                }
            }
            chordDisplay.innerText = activeChord;

            const activeLyrics = songData.lyricsTimeline.find(
                item => currentBeat >= item.startBeat && currentBeat <= item.endBeat
            );
            lyricsDisplay.innerText = activeLyrics ? activeLyrics.text : "🎤 (ดนตรีบรรเลง)";
        }

        function stopSession() {
            chordDisplay.innerText = "จบการฝึก";
            lyricsDisplay.innerText = "ทบทวนการเคลื่อนไหวจากกระจกเงาได้เลยครับ!";
            startBtn.disabled = false;
        }

        startBtn.addEventListener('click', () => {
            if (songData) {
                startBtn.disabled = true;
                audio.start(songData.bpm, songData.totalBeats);
            }
        });

        // 🌟 7. ฟังก์ชันตัวจุดระเบิดระบบ (Bootstrap)
        async function bootstrap() {
            try {
                // เปิดกล้องและ Canvas ผ่านโมดูล mirror.js (ฟังก์ชันเดียวจบ ไม่มีซ้ำซ้อนแล้ว)
                await visual.init();
                
                // โหลดข้อมูลเพลง
                await loadSongFromCloud();
            } catch(err) {
                console.error(err);
                statusText.innerText = "เกิดข้อผิดพลาดในการเปิดระบบ: " + err.message;
            }
        }

        // เริ่มต้นรันระบบเมื่อเปิดหน้าเว็บ
        bootstrap();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCM - Orff Construct Mirror (Die With A Smile Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary-color: #00adb5;
            --primary-hover: #007a80;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --active-block: #ffde59;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--primary-color); margin: 0 0 5px 0; font-size: 24px; }
        #status { color: #ffde59; font-style: italic; margin-bottom: 20px; font-size: 14px; font-weight: bold; }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        /* ส่วนบน: วิดีโอและกระจกเงาเคียงข้างกัน */
        .top-media-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .media-box {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex: 1;
            min-width: 320px;
            max-width: 520px;
            text-align: center;
        }

        .media-box h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; color: #ccc; }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        #yt-player { width: 100%; height: 100%; border: none; }
        
        #output-canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            background: #222;
        }

        /* ส่วนแถบควบคุมตรงกลาง */
        .control-bar {
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .controls-left { display: flex; align-items: center; gap: 15px; }
        
        select, button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #444; cursor: not-allowed; }

        .time-display { font-family: monospace; font-size: 16px; color: #aaa; }

        /* ส่วนล่าง: แผงควบคุมคอร์ดและตัวโน้ตแนวนอน (Chordify Style) */
        .timeline-section {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        .chord-timeline-scroll {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            padding: 15px 5px;
            background: #151515;
            border-radius: 8px;
            scroll-behavior: smooth;
        }

        .chord-timeline-scroll::-webkit-scrollbar { height: 8px; }
        .chord-timeline-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .beat-block {
            flex: 0 0 80px;
            height: 80px;
            background: #262626;
            border: 2px solid #3a3a3a;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .beat-block .beat-num { font-size: 11px; color: #666; width: 100%; text-align: left; }
        .beat-block .chord-name { font-size: 16px; font-weight: bold; color: #555; }
        
        .beat-block.has-chord { border-color: #444; background: #2d2d2d; }
        .beat-block.has-chord .chord-name { color: #ffde59; font-size: 18px; }

        .beat-block.active {
            background: var(--primary-color);
            border-color: #fff;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(0, 173, 181, 0.6);
        }
        .beat-block.active .beat-num { color: #fff; }
        .beat-block.active .chord-name { color: #000; }

        .lyrics-bar {
            margin-top: 15px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            min-height: 28px;
            border-left: 5px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <h1>OCM: Orff Construct Mirror</h1>
    <p id="status">กรุณาเข้าสู่ระบบผ่านคลาวด์...</p>

    <div id="login-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6">ยินดีต้อนรับสู่ OCM</h2>
            <p class="text-slate-400 mb-8 text-sm">ล็อกอินเพื่อเข้าสู่ห้องซ้อมและประวัติการซ้อมของคุณ</p>
            
            <button id="btn-mock-login" class="w-full py-3 bg-[#00B900] hover:bg-[#009900] text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-all">
                <i class="ph-bold ph-line-logo text-xl"></i> ล็อกอินด้วย LINE (จำลอง)
            </button>
        </div>
    </div>

    <div id="main-dashboard" class="hidden main-layout">
        
        <div class="top-media-section">
            <div class="media-box">
                <h3>📺 บทเรียนต้นแบบ (YouTube Player)</h3>
                <div class="video-wrapper">
                    <div id="yt-player"></div>
                </div>
            </div>

            <div class="media-box">
                <h3>👁️ กระจกโต้ตอบการเคลื่อนไหว (Visual Mirror)</h3>
                <div class="video-wrapper">
                    <video id="webcam" autoplay playsinline muted style="display: none;"></video>
                    <canvas id="output-canvas"></canvas>
                </div>
            </div>
        </div>

        <div class="control-bar">
            <div class="controls-left">
                <label for="song-select" style="font-weight:bold;">เลือกเพลงซิงค์ระบบคลาวด์:</label>
                <select id="song-select" class="text-black bg-white font-normal">
                    <option value="die_with_a_smile">Die With A Smile - Bruno Mars & Lady Gaga</option>
                </select>
                <button id="play-btn" disabled>▶ เล่นเพลง</button>
            </div>
            <div class="time-display" id="time-text">00:00 / 00:00</div>
        </div>

        <div class="timeline-section">
            <h3 style="margin-top: 0; font-size: 16px; color: #aaa;" id="timeline-title">🎵 แถบจังหวะและคอร์ด</h3>
            <div class="chord-timeline-scroll" id="chord-timeline"></div>
            <div class="lyrics-bar" id="lyrics-display">🎤 กดปุ่มเล่นเพลงเพื่อเริ่มการซิงค์จังหวะดนตรี...</div>
        </div>

    </div>

    <script type="module">
        // 🌟 ย้าย Import ทั้งหมดขึ้นมาไว้บนสุดเพื่อป้องกันสโคปของตัวแปรพัง
        import { db, fetchSongData } from "./src/firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { OCMVisualEngine } from "./src/mirror.js";
        import { OCMAudioEngine } from "./src/audio.js";
        import { OCMUIEngine } from "./src/ui.js";

        const loginScreen = document.getElementById('login-screen');
        const mainDashboard = document.getElementById('main-dashboard');
        const btnMockLogin = document.getElementById('btn-mock-login');
        
        const statusText = document.getElementById('status');
        const playBtn = document.getElementById('play-btn');
        const songSelect = document.getElementById('song-select');
        const timeText = document.getElementById('time-text');
        const timelineTitle = document.getElementById('timeline-title');

        let songData = null;

        // 🌟 ประกอบร่าง Engines ย่อยตามหลักการแยกโมดูล
        const uiEngine = new OCMUIEngine({
            gridId: "chord-timeline",
            lyricsId: "lyrics-display"
        });

        const visualEngine = new OCMVisualEngine("webcam", "output-canvas");

        const audioEngine = new OCMAudioEngine(
            "yt-player", 
            (currentBeat, currentTime, duration) => {
                uiEngine.updateVisuals(currentBeat, songData);
                timeText.innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
            },
            () => {
                uiEngine.resetDisplays();
                playBtn.innerText = "▶ เล่นเพลง";
            }
        );

        // 🌟 ฟังก์ชันจัดการจำลองการ Authentication ผ่านทาง LINE
        btnMockLogin.addEventListener('click', async () => {
            const mockLineId = "U123456789"; // จำลองค่ารับเข้าจากไลน์ API ในอนาคต
            statusText.innerText = "กำลังตรวจสอบสิทธิ์ในฐานข้อมูลสหพันธ์...";
            
            try {
                const userDoc = await getDoc(doc(db, "users", mockLineId));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    // ปิดหน้าจอ Login และทำการเปลี่ยน State เป็นพื้นที่ Dashboard หลัก
                    loginScreen.classList.add('hidden');
                    mainDashboard.classList.remove('hidden');
                    
                    // ดึงและตั้งค่าบริบทเพลงเฉพาะของวงดนตรีนั้น
                    await loadBandData(userData.bandId);
                } else {
                    alert("ไม่พบข้อมูลบัญชีรายชื่อนักเรียนนี้บนคลาวด์ โปรดสร้าง Document ID: U123456789 ใน Collection 'users' ก่อนครับ");
                    statusText.innerText = "การยืนยันตัวตนล้มเหลว";
                }
            } catch (e) {
                console.error(e);
                statusText.innerText = "เกิดข้อผิดพลาดในการล็อกอิน: " + e.message;
            }
        });

        // ดึงข้อมูลการตั้งค่าบริบทวง (Band Context)
        async function loadBandData(bandId) {
            statusText.innerText = `กำลังดึงข้อมูลบริบทของวง: ${bandId}...`;
            try {
                const bandDoc = await getDoc(doc(db, "bands", bandId));
                if (bandDoc.exists()) {
                    statusText.innerText = `ยินดีต้อนรับนักเรียนจากวง: ${bandDoc.data().bandName || bandId}`;
                    // โหลดเพลงหลักจำลองของวงขึ้นมาแสดงผลต่อทันที
                    await loadSongFromFirestore();
                } else {
                    statusText.innerText = `เชื่อมต่อสำเร็จ (เปิดโหมดจับคู่วงแบบอิสระ: ${bandId})`;
                    await loadSongFromFirestore();
                }
            } catch (e) {
                statusText.innerText = "Error loadBandData: " + e.message;
            }
        }

        // ดึงโครงสร้างข้อมูลของเนื้อเพลงและทางคอร์ดจาก Cloud Firestore
        async function loadSongFromFirestore() {
            playBtn.disabled = true;
            statusText.innerText = "กำลังซิงค์ข้อมูลเพลงและตัวโน้ตกับคลาวด์...";
            try {
                const songId = songSelect.value;
                songData = await fetchSongData(songId);
                
                statusText.innerText = `พร้อมทำการซ้อมเรียบร้อย! เพลง: "${songData.title}"`;
                timelineTitle.innerText = `🎵 แถบจังหวะและคอร์ด - ${songData.title} (Time Signature: ${songData.timeSignature || '4/4'})`;
                
                // สั่งเรนเดอร์ตารางบล็อกแนวนอนสไตล์เลื่อนตาม
                uiEngine.renderGrid(songData);
                
                // ดึงพิกัดวิดีโอ YouTube สำรองกรณีค่าฐานข้อมูลว่างอยู่
                const ytId = songData.youtubeId || "EczwTVG96fM";
                audioEngine.loadVideo(ytId, songData.bpm);
                
                playBtn.disabled = false;
            } catch (err) {
                statusText.innerText = "เกิดข้อผิดพลาดในการโหลดคอร์ดเพลง: " + err.message;
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        playBtn.addEventListener('click', () => {
            if (audioEngine.isPlaying) {
                audioEngine.pause();
                playBtn.innerText = "▶ เล่นเพลง";
            } else {
                audioEngine.play();
                playBtn.innerText = "⏸ หยุดชั่วคราว";
            }
        });

        songSelect.addEventListener('change', loadSongFromFirestore);

        // ฟังก์ชันเปิดระบบโดยเริ่มต้นจากอุปกรณ์มองเห็น (Visual Hardware Interface Only)
        async function bootstrap() {
            try {
                await visualEngine.init(); 
            } catch (err) {
                console.error(err);
                statusText.innerText = "เกิดข้อผิดพลาดในการเข้าถึงกล้องตรวจจับ: " + err.message;
            }
        }

        bootstrap();
    </script>
</body>
</html>
